# 自动构建并推送镜像到 GitHub Container Registry (GHCR)
#
# 触发：
#   - push 到 main
#   - 打 tag（v1.2.3 / v1.2）—— 同时打上语义化版本号标签
#   - 手动触发（Actions 页面 Run workflow）
#
# 产出镜像：ghcr.io/<owner>/<repo>:latest 、:main 、:sha-xxxxxxx 、:v1.2.3
#
# 服务器侧只需 `docker compose pull && docker compose up -d`，
# 不必在上面跑 next build（那台机器只有 1966MB 内存，build 会把整机拖死）。

name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 生成标签与 OCI 元数据。镜像名一律小写（GHCR 要求）。
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 构建产物走 GHA 缓存，第二次起快很多。
          # 注意：这里不用 --max-old-space-size 的限制 ——
          # CI runner 内存充足，那条限制是给只有 2G 内存的生产机准备的。
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_OPTIONS=--max-old-space-size=4096
