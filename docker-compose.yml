# 默默与幸 —— 生产编排
#
# 用法：
#   1. cp .env.example .env && 填入 SESSION_SECRET
#   2. docker compose up -d --build
#
# 访问：http://<服务器 IP>:5200

services:
  momo:
    build:
      context: .
    image: momo:latest
    container_name: momo
    restart: unless-stopped

    ports:
      - "5200:3000"

    environment:
      NODE_ENV: production
      # SQLite 落在挂载卷里，重建容器不丢数据
      DIARY_DB_PATH: /app/data/diary.db
      # 必填 —— 没设会直接报错，避免生产用上随手生成的密钥
      SESSION_SECRET: ${SESSION_SECRET:?请先创建 .env 并设置 SESSION_SECRET}
      INVITE_CODES: ${INVITE_CODES:-momo:0}
      TZ: Asia/Shanghai

    volumes:
      - ./data:/app/data
      # 备份输出目录。容器内的 better-sqlite3 直接把在线备份写到这里，
      # 落在宿主机 /opt/momo/backups/ 下，随时可以直接拿走。
      # 不写进 data/ 是为了避免「备份被下一次备份再打包一遍」的递归膨胀。
      - ./backups:/app/backups

    # 40G 的盘经不起日志无限涨，限一下
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
