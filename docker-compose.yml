# 默默与幸 —— 生产编排（拉取预构建镜像版）
#
# 用 GitHub Actions 构建好的镜像，服务器上**不跑 next build**。
# 生产机只有 1966MB 内存，本地 build 会把它拖死 —— 所以推荐用这个文件。
#
# 用法：
#   1. cp .env.example .env
#   2. 往 .env 里填 SESSION_SECRET（openssl rand -hex 32）和 INVITE_CODES
#   3. 把下面的 image: 换成你自己的 GHCR 地址（全小写）
#         ghcr.io/flowleaves/momoyvxing:latest
#   4. 若仓库是私有的，先登录一次：echo <PAT> | docker login ghcr.io -u <用户名> --password-stdin
#   5. docker compose pull && docker compose up -d
#
# 访问：http://<服务器 IP>:5200

services:
  momo:
    # ★ 改成你的镜像地址。GHCR 要求全小写，仓库名 momoyvxing 本身就是小写。
    image: ghcr.io/flowleaves/momoyvxing:latest
    container_name: momo
    restart: unless-stopped

    ports:
      - "5200:3000"

    environment:
      NODE_ENV: production
      # SQLite 落在挂载卷里，重建容器不丢数据
      DIARY_DB_PATH: /app/data/diary.db
      # 必填 —— 没设会直接报错，避免生产用上随手生成的密钥
      SESSION_SECRET: ${SESSION_SECRET:?请先创建 .env 并设置 SESSION_SECRET}
      INVITE_CODES: ${INVITE_CODES:-momo:0}
      TZ: Asia/Shanghai

    volumes:
      - ./data:/app/data
      # 备份输出目录。容器内的 better-sqlite3 直接把在线备份写到这里，
      # 落在宿主机 ./backups/ 下，随时可以直接拿走。
      # 不写进 data/ 是为了避免「备份被下一次备份再打包一遍」的递归膨胀。
      - ./backups:/app/backups

    # 40G 的盘经不起日志无限涨，限一下
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
